[main]
font=monospace:size=10
prompt="> "
lines=20
width=100
horizontal-pad=20
vertical-pad=10
inner-pad=10

[colors]
# Base
background=080808ff
text=eeeeeeff
prompt=eeeeeeff
placeholder=7c8f8fff
input=eeeeeeff

# Matches (accent)
match=e3c78aff

# Selection (Moonfly blue)
selection=74b2ffff
selection-text=080808ff
selection-match=080808ff

# Border (subtle charcoal)
border=323437ff

[border]
width=1
radius=0
