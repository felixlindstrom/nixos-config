# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = eu
    kb_variant = 
    kb_model =
    kb_options = ctrl:nocaps #, altwin:swap_alt_win
    kb_rules =

    follow_mouse = 2

    touchpad {
        natural_scroll = no
    }

    sensitivity = 0 # -1.0 to 1.0, 0 means no modification.

    repeat_delay = 300
    repeat_rate = 70
}

